<!DOCTYPE html>
<html lang="ko">
<head>

    <style>
        body { font-family: 'Malgun Gothic', sans-serif; text-align: center; padding: 50px; background: #f4f6f9; color: #333; }

        h1 { color: #24292e; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 15px; line-height: 1.6; }

    <div class="container">
